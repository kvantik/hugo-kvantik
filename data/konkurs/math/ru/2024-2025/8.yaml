tour:
  deadline: 5 мая
  number: 8
  problems:
  - author: 'Александр Грибалко'
    image_art: 36.png
    image_scheme: ''
    number: 36
    problem: 'Назовём натуральное число <i>троечным</i>, если оно делится на 3 или содержит тройку в десятичной записи. Найдите хотя бы одно такое число N, что среди чисел от 1 до N ровно половина троечных.'
  - author: 'Иван Русских'
    image_art: 37.png
    image_scheme: ''
    number: 37
    problem: 'У Саши есть плоская коробка в виде клетчатого многоугольника, в которой лежат 5 шоколадок размером 1 × 5. Саша захотел упаковать шоколадки так, чтобы они не болтались (никакую нельзя подвинуть ни по горизонтали, ни по вертикали ни на одну клеточку). Оказалось, что тогда в коробку можно упаковать 2 шоколадки, а больше — не получается. Приведите пример такой коробки.'
  - author: 'Борис Френкин'
    image_art: 38.png
    image_scheme: ''
    number: 38
    problem: 'У мудрецов Пети, Васи и Тимы ко лбу прикреплены бумажки, на каждой из которых написано натуральное число. Известно, что сумма всех трёх чисел не больше 5. На вопрос «можешь ли ты назвать своё число» Петя ответил «нет», затем Вася ответил «нет», а затем Тима назвал своё число и обосновал ответ. Какое число было написано у Тимы?'
  - author: 'Сергей Костин'
    image_art: 39.png
    image_scheme: ''
    number: 39
    problem: 'Вася покрасил 131 клетку в квадрате 13 × 13 в синий цвет, а остальные клетки в зелёный. Верно ли, что Петя в любом случае сможет вырезать из этого квадрата двадцать целиком синих пентаминошек (не обязательно одинаковых)?'
  - author: 'Михаил Евдокимов'
    image_art: 40.png
    image_scheme: ''
    number: 40
    problem: 'В треугольнике ABC биссектриса угла A делит медиану, проведённую из вершины B, пополам. Какое наибольшее значение может иметь величина угла C?'
  title: VIII тур
