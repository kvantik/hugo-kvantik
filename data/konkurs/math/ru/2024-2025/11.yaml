tour:
  deadline: 5 августа
  number: 11
  problems:
  - author: 'Сергей Костин'
    image_art: 51.png
    image_scheme: '51-scheme.png'
    number: 51
    problem: 'Когда Глебу исполнилось 9 лет, папа задал ему хитрую ма­тематическую задачу: разрезать фигуру в виде первой буквы его имени (см. рисунок) на 9 равных частей. Помогите Глебу спра­виться с этой задачей.'
  - author: 'Татьяна Казицына'
    image_art: 52.png
    image_scheme: ''
    number: 52
    problem: 'Белая, Серая, Чёрная и Рыжая мышки живут в четырёх норках, расположенных в ряд, причём сосе­ди Белой — Серая и Чёрная. Каждая мышка предпо­читает свой вид сыра: Белая — сыр «Б», Серая — сыр «С», Чёрная — сыр «Ч», Рыжая — сыр «Р». Если ве­чером перед норкой мышки положить кусочек сыра, она съест его к утру, только если это её любимый сыр. <br>У Феди есть по одному кусочку сыра каждого вида. Помогите Феде разложить вечером перед норками его 4 кусочка так, чтобы наутро однозначно определить, кто где живёт. (Сыр у чужих норок мыши не едят.)'
  - author: 'Георгий Караваев'
    image_art: 53.png
    image_scheme: '53-scheme.png'
    number: 53
    problem: 'Маша сло­жила из пяти одинаковых квадратов фигуру, нарисованную слева. Измерив её периметр (в сантиметрах) и площадь (в сантиметрах квадратных), она с удивлением обнаружила, что число получилось одно и то же. Петя сложил из этих же квадратов фигуру, нари­сованную справа. Найдите её периметр.'
  - author: 'Михаил Мурашкик'
    image_art: 54.png
    image_scheme: ''
    number: 54
    problem: 'Можно ли расставить а) числа от 1 до 16 в таблице 4×4; б) числа от 1 до 100 в таб­лице 10×10 так, чтобы в каждом квадрате 3×3 суммы чисел в столбцах совпадали? (В разных квадратах 3×3 эти суммы могут различаться.)'
  - author: 'Константин Кноп и Александр Грибалко'
    image_art: 55.png
    image_scheme: ''
    number: 55
    problem: 'Из шести внешне одинаковых монет три весят по 9 г, а три — по 10 г. Они лежат в вер­шинах правильного шестиугольника. За какое наименьшее число взвешиваний на двухчашеч­ных весах без гирь можно гарантированно вы­яснить, лежат ли 10-граммовые монеты в вер­шинах равнобедренного треугольника?'
  title: XI тур
