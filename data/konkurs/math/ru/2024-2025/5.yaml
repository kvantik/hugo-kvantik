tour:
  deadline: 5 февраля
  number: 5
  problems:
  - author: 'Максим Прасолов'
    image_art: 21.png
    image_scheme: ''
    number: 21
    problem: 'Замок имеет форму правильного треугольника. Барон хочет расставить часовых на стенах замка так, чтобы каждая точка вне замка была в поле зрения часовых. Хватит ли шести часовых, если часовой видит всё в пределах угла 60°, причём замок не должен загораживать обзор? В одной точке можно располагать несколько часовых.'
  - author: 'Борис Френкин'
    image_art: 22.png
    image_scheme: ''
    number: 22
    problem: 'Вася в течение 7 дней подряд решал задачи (не меньше чем по одной), причём в каждый следующий день он решал на 1 задачу больше, с единственным исключением: в воскресенье Вася решил столько же задач, сколько и в субботу. Всего он решил 24 задачи. Сколько задач Вася решил в среду?'
  - author: 'Александр Грибалко'
    image_art: 23.png
    image_scheme: ''
    number: 23
    problem: 'Набор домино состоит из 28 различных прямо­угольников 1×2, в клетках которых поставлено от 0 до 6 точек. Петя сложил все доминошки в произвольном порядке в кольцо так, что получилась прямоугольная рамка толщиной в клетку доминошки. Затем Вася склеил все доминошки по соседним сторонам, а потом разрезал каждую доминошку на две половинки. Могло ли оказаться, что полученные Васей доминошки тоже образуют полный набор?'
  - author: 'Николай Авилов'
    image_art: 24.png
    image_scheme: '24-scheme.png'
    number: 24
    problem: 'Фигуру-«вертушку», изображенную на рисунке, разрежьте на четыре равные (и по форме, и по размеру) части так, чтобы из них можно было сложить квадрат, без наложений и просветов.'
  - author: 'Сергей Костин'
    image_art: 25.png
    image_scheme: '25-scheme.png'
    number: 25
    problem: 'На столе лежат шкатулки — 7 вверху и 7 внизу так, как на рисунке. В одной из шкатулок находится Волшебный цветок. Если открыть эту шкатулку, то начинает играть вальс. Если открыть шкатулку, в которой нет Волшебного цветка, но он находится в одной из соседних шкатулок (слева, справа, сверху или снизу), то звенит колокольчик. Какое наименьшее количество шкатулок надо открыть, чтобы точно понять, в какой шкатулке находится Волшебный цветок?'
  title: V тур
