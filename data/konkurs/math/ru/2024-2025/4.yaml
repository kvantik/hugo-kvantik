tour:
  deadline: 5 января
  number: 4
  problems:
  - author: 'Ксения Пахомова'
    image_art: 16.png
    image_scheme: ''
    number: 16
    problem: 'Квантик написал на доске выражение, состоящее из двоек, знаков «+» и «×» и, возможно, скобок. Его значение равно 24. Ноутик заменил в этом выражении все знаки «+» на знаки «×», а все знаки «×» на знаки «+». Могло ли оказаться, что значение нового выражения тоже равно 24?'
  - author: 'Сергей Шамсутдинов'
    image_art: 17.png
    image_scheme: ''
    number: 17
    problem: 'Известно, что пятизначное число <i>abcde</i> делится на 41. Его последнюю цифру удалили и поставили в начало. Докажите, что полученное число <i>eabcd</i> тоже делится на 41.'
  - author: 'Сергей Полозков'
    image_art: 18.png
    image_scheme: ''
    number: 18
    problem: 'Разрежьте равносторонний треугольник на шесть равных четырёхугольников. Четырёхугольники равны, если их можно совместить наложением (возможно, с переворотом).'
  - author: 'Георгий Караваев'
    image_art: 19.png
    image_scheme: ''
    number: 19
    problem: 'В комнате находится 50 лампочек. К каждой лампочке подсоединены два выключателя, каждый либо включен, либо выключен. Лампочка горит только тогда, когда оба выключателя, подсоединённых к ней, включены. Сначала в комнате горело 15 лампочек, а когда все 100 выключателей переключили, стало гореть 24 лампочки. Сколько выключателей теперь надо переключить, чтобы зажглись все лампочки?'
  - author: 'Фёдор Ивлев'
    image_art: 20.png
    image_scheme: ''
    number: 20
    problem: 'Федя разложил перед собой 16 лотерейных билетов и продаёт их по 1000 рублей за каждый. Два из них выигрышные — купивший получит стоимость билета и ещё 1000 рублей выигрыша. Федя сегодня добрый, и за 100 рублей ему можно задать любой вопрос, который допускает ответ «да» или «нет», и он честно на него ответит. Можно ли, задав несколько вопросов, гарантированно заработать <br>а) 1200 рублей;<br>б) 1300 рублей?'
  title: IV тур
