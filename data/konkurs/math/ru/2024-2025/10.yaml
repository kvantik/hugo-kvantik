tour:
  deadline: 5 июля
  number: 10
  problems:
  - author: 'Борис Френкин'
    image_art: 46.png
    image_scheme: ''
    number: 46
    problem: 'Петя и Вася родились в разные чис­ла одного месяца. В записи обоих чисел используется одна и та же цифра, причём других цифр там нет. Если бы оба маль­чика родились на день раньше, то, запи­сав числа их рождения, мы не нашли бы там одинаковых цифр. В каком месяце родились Петя и Вася?'
  - author: 'Татьяна Казицына'
    image_art: 47.png
    image_scheme: ''
    number: 47
    problem: 'Катя высадила в ряд несколько тюль­панов, а Таня — несколько гвоздик. Катин ряд (от первого цветка до последнего) ока­зался в 15 раз длиннее Таниного, а цветков на нём только в 13 раз больше, чем на Та­нином. Расстояние между любыми сосед­ними цветками равно 10 см. Какова длина Катиного ряда и какова длина Таниного? (Толщину цветков считайте нулевой.)'
  - author: 'Михаил Мурашкин'
    image_art: 48.png
    image_scheme: ''
    number: 48
    problem: 'В поход пошли 10 туристов, каж­дый день дежурили двое из них, и ни одна пара не дежурила более одного раза. При этом ровно шестеро туристов дежурили с тремя другими, ровно один — с пятью другими и ровно двое — с девятью другими. Сколько дней длился по­ход? Укажите все возможные варианты.'
  - author: 'Константин Кноп'
    image_art: 49.png
    image_scheme: ''
    number: 49
    problem: 'Можно ли разрезать ромб с угла­ ми 60 и 120 на 6 равных (и по форме, и по размеру) частей так, чтобы центр ромба оказался строго внутри (не на границе) одной из этих частей?'
  - author: 'Георгий Караваев'
    image_art: 50.png
    image_scheme: ''
    number: 50
    problem: 'У Паши есть 5 грузов, которые весят 1, 2, 3, 4 и 5 граммов (Паша это знает, но с виду грузы одинаковы), а также электрон­ные весы: если на них поставить один или несколько грузов, они покажут их суммар­ный вес. У весов сломался экран, поэто­му вместо любой цифры они показывают «?». Например, число 6 эти весы покажут как «?», а число 2025 — как «????». Веса каких из этих 5 грузов можно однознач­но восстановить, пользуясь только этими электронными весами? (Можно делать сколько угодно взвешиваний.)'
  title: X тур
