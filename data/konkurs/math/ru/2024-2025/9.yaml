tour:
  deadline: 5 июня
  number: 9
  problems:
  - author: 'Александр Блинков'
    image_art: 41.png
    image_scheme: ''
    number: 41
    problem: 'Натуральное число сложили с суммой его цифр и получили 2025. Найдите все такие числа и докажите, что других нет.'
  - author: 'Дмитрий Калинин'
    image_art: 42.png
    image_scheme: '42-scheme.png'
    number: 42
    problem: 'Разрежьте фигуру на 3 равные (по форме и по размеру) части.'
  - author: 'Михаил Евдокимов'
    image_art: 43.png
    image_scheme: ''
    number: 43
    problem: 'У Васи есть несколько деталей в форме буквы «Г» из четырёх единичных кубиков и на одну меньше деталей вида 1×2×2. Он сложил большой куб без дырок и внутренних полостей. Докажите, что осталась хотя бы одна неисполь­зованная деталь.'
  - author: 'Александр Перепечко'
    image_art: 44.png
    image_scheme: ''
    number: 44
    problem: 'Хирург оперирует вслепую по рентген-снимкам. Операция состоит из 20 действий, и каждое действие со­ вершается либо сверху, либо сбоку, либо спереди. Снимок можно сделать в любой момент опять же либо свер­ху, либо сбоку, либо спереди. Снимок можно использовать только во время двух следующих действий после того, как он был сделан. Для дальнейших действий он считается негодным.<br>Чтобы совершить очередное дей­ствие, нужен годный снимок со сто­роны, отличной от стороны действия (скажем, для действия сверху подой­дёт снимок сбоку или спереди). Какого наименьшего числа снимков хирургу гарантированно хватит, если<br>а) он будет узнавать до операции всю последовательность предстоящих 20 действий;<br>б) он будет узнавать, какое следую­щее действие понадобится, только по­сле выполнения предыдущего?'
  - author: 'Александр Домашенко'
    image_art: 45.png
    image_scheme: '45-scheme.png'
    number: 45
    problem: 'Аня раскрасила ромашку из семи равных правильных шестиугольников в два цвета — жёлтый и белый. Какой краски потребовалось больше?'
  title: IX тур
