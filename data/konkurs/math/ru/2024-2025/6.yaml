tour:
  deadline: 5 марта
  number: 6
  problems:
  - author: 'Борис Френкин'
    image_art: 26.png
    image_scheme: ''
    number: 26
    problem: 'Маша, которая сейчас учится в школе, записала свою дату рождения в формате ДД.ММ.ГГ, использовав шесть различных цифр. Могла ли Маша родиться в один из зимних месяцев? Ответ объясните.'
  - author: 'Сергей Костин'
    image_art: 27.png
    image_scheme: '27-scheme.png'
    number: 27
    problem: 'Петя ходит шахматным конём, не отрывая его от доски (то есть конь посещает и промежуточные клетки хода, см. пример на рисунке). Может ли Петя, начав с какой-то клетки, обойти конём всю доску 5×5, посетив каждую клетку ровно один раз?'
  - author: 'Михаил Евдокимов'
    image_art: 28.png
    image_scheme: ''
    number: 28
    problem: 'Вася называет натуральное число, состоящее из ненулевых цифр, красивым, если и произведение, и сумма его цифр делятся на 100. Найдите наименьшее красивое число и докажите, что меньше него красивых чисел нет.'
  - author: 'Николай Авилов'
    image_art: 29.png
    image_scheme: '29-scheme.png'
    number: 29
    problem: 'Из спичек сложен квадрат, а на двух его сторонах из спичек построены равносторонние треугольники. Получился невыпуклый шестиугольник. Переложите две спички внутри него так, чтобы он разделился на две части, равные по форме и по размеру. (Спички не должны выходить за пределы шестиугольника, их нельзя ломать, нельзя накладывать друг на друга.)'
  - author: 'Максим Прасолов'
    image_art: 30.png
    image_scheme: ''
    number: 30
    problem: 'Четверо ребят получили от воспитательницы по игрушке. Потом она собрала эти четыре игрушки и снова раздала ребятам так, что каждый получил ту игрушку, которой у него до этого не было. <br>а) Верно ли, что вне зависимости от того, как были выданы игрушки до этого, воспитательница сможет собрать игрушки и раздать их в третий раз так, чтобы каждый получил новую? <br>б) А в четвёртый раз? Ответ объясните.'
  title: VI тур
