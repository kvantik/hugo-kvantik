tour:
  deadline: 5 сентября
  number: 12
  problems:
  - author: 'Сергей Дворянинов'
    image_art: 56.png
    image_scheme: ''
    number: 56
    problem: 'Дети собирали в саду яблоки и груши. Оказалось, что все собрали плодов поровну. Костя собрал треть количества всех яблок и пятую часть количества всех груш. Сколько было детей?'
  - author: 'Татьяна Казицына'
    image_art: 57.png
    image_scheme: ''
    number: 57
    problem: 'а) Один кот съедает один батон колбасы за 15 минут. У вас есть 3 батона колбасы и 5 котов. Как с помощью них отмерить 1 минуту? Батон колбасы можно дать одновременно любому количеству котов, и они будут поедать его равномерно. б) Получится ли отмерить минуту, если батонов всего 2?'
  - author: 'Борис Френкин'
    image_art: 58.png
    image_scheme: ''
    number: 58
    problem: 'Остров среди моря имеет форму правильного десятиугольника. В некоторых точках побережья предполагается установить маяки. Какое наименьшее количество маяков нужно, чтобы <br>а) из любой точки моря, достаточно далёкой от берега, был виден хотя бы один маяк; <br>б) всё море было освещено? <br>(Считайте маяк точкой. Маяк светит во все стороны, свет от него распространяется в море неограниченно далеко. Весь остров покрыт высокими скалами, через них ничего не видно.)'
  - author: 'Игорь Акулич'
    image_art: 59.png
    image_scheme: ''
    number: 59
    problem: 'Какое а) наименьшее; б) наибольшее количество фишек можно расставить на шахматной доске 8×8 так, чтобы в любом клетчатом квадрате 3×3 стояла ровно одна фишка?'
  - author: 'Борис Френкин'
    image_art: 60.png
    image_scheme: ''
    number: 60
    problem: 'В центре круглой площади начинаются 4 дороги: на север, восток, юг и запад. По всему краю площади высажены деревья через равные расстояния. Между северной и восточной дорогами растёт 8 деревьев, между восточной и южной тоже 8, между южной и западной 7. Сколько деревьев растёт между западной и северной дорогами?'
  title: XII тур
