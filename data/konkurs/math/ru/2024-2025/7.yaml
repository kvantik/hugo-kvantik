tour:
  deadline: 5 апреля
  number: 7
  problems:
  - author: 'Сергей Полозков'
    image_art: 31.png
    image_scheme: '31-scheme.png'
    number: 31
    problem: 'Фигуру на рисунке разрежьте на две части и сложите из них правильный шести­угольник (все его стороны равны, и все углы тоже). Части можно поворачивать и перево­рачивать.'
  - author: 'Сергей Костин'
    image_art: 32.png
    image_scheme: '32-scheme.png'
    number: 32
    problem: 'Замените снежинки в ребусе на различные цифры (от 0 до 9) так, чтобы получилось верное равенство. (Напомним, что натуральное число в нулевой степени считается равным 1.)'
  - author: 'Борис Френкин'
    image_art: 33.png
    image_scheme: ''
    number: 33
    problem: 'Вася испёк пирог в виде квадрата и отрезал от него треугольник так, что остался четырёхугольник. Затем он разрезал четырёхугольную часть на два тре­угольника. Какую долю от всего пирога составляет наибольшая из трёх получившихся частей? (Все раз­резы прямолинейные.)'
  - author: 'Александр Перепечко'
    image_art: 34.png
    image_scheme: ''
    number: 34
    problem: 'В каждой клетке бесконечной клетчатой плоскости нарисована стрел­ка вверх, вниз, вправо или влево. Мо­жет ли оказаться так, что из каждой клетки в каждую есть путь, идущий по соседним клеткам согласно стрелкам?'
  - author: 'Александр Грибалко'
    image_art: 35.png
    image_scheme: ''
    number: 35
    problem: 'Пять спортсменов провели восемь забегов на разные дистанции; все всег­да финишировали в разное время. Перед каждым забегом Петя делал прогноз, в каком порядке финишируют спортсмены, а потом записывал в блокнот, сколько по­зиций он угадал верно. В итоге оказалось, что каждое следующее число в блокноте отличается от предыдущего, а сумма всех восьми чисел равна 30. В скольких забе­гах Петя угадал все пять позиций?'
  title: VII тур
