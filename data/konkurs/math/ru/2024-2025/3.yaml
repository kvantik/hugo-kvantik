tour:
  deadline: 5 декабря
  number: 3
  problems:
  - author: 'Михаил Леляков'
    image_art: 11.png
    image_scheme: '11-scheme.png'
    number: 11
    problem: 'Разрежьте фигуру на рисунке на 2 равные (и по форме, и по размеру) части.'
  - author: 'Николай Авилов'
    image_art: 12.png
    image_scheme: '12-scheme.png'
    number: 12
    problem: 'Квадрат 3×3 сложен из квадратных фишек 1×1, пронумерованных числами от 1 до 9. Изначально фишки лежат так, как на рисунке слева. Любые четыре фишки, образующие квадрат 2×2, можно поворачивать вокруг его центра на угол, кратный 90 градусам. Можно ли с помощью нескольких таких поворотов получить расположение, в котором фишки расположены так, как на рисунке справа?'
  - author: 'Игорь Акулич'
    image_art: 13.png
    image_scheme: ''
    number: 13
    problem: 'Квадраты последовательных натуральных чисел 13 и 14 записываются одними и теми же цифрами, но в разном порядке: 169 и 196. Существуют ли три последовательных натуральных числа, обладающих тем же свойством?'
  - author: 'Георгий Караваев'
    image_art: 14.png
    image_scheme: '14-scheme.png'
    number: 14
    problem: 'Из клетчатой скатерти со стороной клетки 1 вырезали прямоугольник со сторонами, параллельными сторонам клеток, как на рисунке. <br>Суммарная площадь белой части прямоугольника равна 10. Найдите его периметр.'
  - author: 'Михаил Евдокимов'
    image_art: 15.png
    image_scheme: ''
    number: 15
    problem: 'Миша смотрел «Что? Где? Когда?» и выписывал счёт, начиная с 0:0 и до конца игры (в каждом раунде разыгрывается одно очко; игра заканчивается, когда зрители или знатоки наберут 6 очков). Если у зрителей было больше очков, Миша делал запись синей ручкой, если очков было больше у знатоков — красной ручкой, а если была ничья – зелёной. Могло ли оказаться, что красных, синих и зелёных записей было поровну?'
  title: III тур
