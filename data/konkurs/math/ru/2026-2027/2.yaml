tour:
  number: 2
  title: "II тур"
  deadline: "5 ноября"
  problems:
  - author: "Сергей Полозков"
    problem: "На прямой через промежутки длиной 1 см отмечено 10 точек. Квантик хочет соединить их одной замкнутой линией, состоящей из полуокружностей с концами в этих точках, так чтобы полуокружности сверху и снизу от прямой чередовались и не пересекали друг друга. Может ли у него при этом получиться ровно 3 полуокружности диаметром 1 см? <br> (На рисунке приведён пример, в котором полуокружностей диаметром 1 см ровно 5.)"
    image_art: "6.png"
    image_scheme: "6-scheme.png"
    number: 6
  - author: "Сергей Дворянинов"
    problem: "Однажды Толик написал в своей тетради несколько двузначных чисел, среди которых нет одинаковых, а общая сумма равна 4888. Какие числа написал Толик?"
    image_art: "7.png"
    image_scheme: ""
    number: 7
  - author: "Сергей Полозков"
    problem: "В ряд стоят 8 тарелок, на крайних лежит по одной конфете, остальные пусты. За ход разрешается указать на любую пустую тарелку, и ведущий положит в неё столько конфет, сколько их лежит в сумме в ближайшей левой и ближайшей правой непустых тарелках. Можно делать ходы, пока есть пустые тарелки. Какого наибольшего суммарного количества конфет на тарелках можно добиться?"
    image_art: "8.png"
    image_scheme: ""
    number: 8
  - author: "Константин Кноп"
    problem: "На встрече было 10 человек, некоторые пожали друг другу руки. Для каждого из десяти человек оказалось, что между остальными девятью людьми произошло ровно 12 рукопожатий. <br>а) Приведите пример, как такое могло быть. <br>б) Верно ли, что в любом примере общее число рукопожатий будет одним и тем же?"
    image_art: "9.png"
    image_scheme: ""
    number: 9
  - author: "Кирилл Сухов"
    problem: "При каких n&thinsp;>&thinsp;5 квадрат n&thinsp;×&thinsp; n можно разрезать на полоски 1&thinsp;×&thinsp;4 и пятиклеточные уголки (см. рисунок)?"
    image_art: "10.png"
    image_scheme: "10-scheme.png"
    number: 10
