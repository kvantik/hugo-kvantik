tour:
  deadline: 5 октября
  number: 1
  problems:
  - author: 'Дмитрий Калинин'
    image_art: 1.png
    image_scheme: '1-scheme.png'
    number: 1
    problem: 'Каждая клетка минного поля 9×9 либо заминирована – в ней находится одна мина, либо безопасна  – в ней нет мины. В некоторых (не всех!) безопасных клетках записано, сколько мин находятся в соседних клетках (см. рисунок; клетки считаются соседними, если у них есть общая сторона или вершина).<br>а) Сколько мин находится на этом поле?<br>б) Сколько есть вариантов расположения этих мин на поле?'
  - author: 'Иван Русских'
    image_art: 2.png
    image_scheme: ''
    number: 2
    problem: 'В Семигорье продают недельные туры по семи горам высотой 1000 м, 2000 м, ..., 7000 м. Королевич Елисей в течение всей недели с понедельника по воскресенье поднимался на одну из гор и в итоге посетил их все. Каждый день, кроме пятницы, Елисей поднимался на более высокую гору, чем накануне. При этом в пятницу он посетил гору высотой 4000 м. А когда Елисей посетил гору высотой 3000 м?'
  - author: 'Борис Френкин'
    image_art: 3.png
    image_scheme: ''
    number: 3
    problem: 'В школьном турнире по настольному теннису каждый участник сыграл с  каждым один раз. Каждую встречу судил один из не занятых в ней игроков. Оказалось, что все участники турнира судили разное количество встреч. Сколько встреч судил тот, кто судил наименьшее количество встреч?'
  - author: 'Сергей Полозков'
    image_art: 4.png
    image_scheme: ''
    number: 4
    problem: 'На шахматной доске 8×8 стоят 16 белых коней. На каждом написано, сколько других коней он бьёт. Могло ли оказаться так, что каждое из чисел 1, 2, 3, 4 написано по 4 раза?'
  - author: 'Георгий Караваев'
    image_art: 5.png
    image_scheme: '5-scheme'
    number: 5
    problem: 'Квантик нашёл в сборнике такую задачу:<br> «Впишите в каждую клетку по числу так, чтобы все равенства оказались верными» (см. рисунок).<br>Квантик забыл, какие числа стояли на месте вопросительных знаков, но он точно помнит, что у задачи было ровно один ответ. Докажите, что хотя бы одно из чисел, скрывающихся за вопросительным знаком, не больше нуля.'
  title: I тур
