tour:
  number: 3
  title: "III тур"
  deadline: "5 декабря"
  problems:
  - author: "Георгий Караваев"
    problem: "Квантик покрасил каждую букву алфавита в красный или синий цвет. В слове «один» одна красная буква, в слове «два» – две красных буквы, а в слове «три» – три красных буквы. Сколько красных букв в слове «двор»?"
    image_art: "11.png"
    image_scheme: ""
    number: 11
  - author: "Михаил Евдокимов"
    problem: "Замените звёздочки различными цифрами от 1 до 7 так, чтобы получилось верное равенство.<br>(Достаточно привести пример.)"
    image_art: "12.png"
    image_scheme: "12-scheme.png"
    number: 12
  - author: "Ольга Манжина"
    problem: "В корпорации «Честность» несколько сотрудников, все они разного возраста и знают возраста друг друга. Каждый человек говорит правду всем, кто старше него, и врёт всем, кто младше него. На совещании все сели за круглый стол, и каждый сказал своему соседу справа: «Самый старший из нас – …», назвав имя сотрудника. Оказалось, что все назвали разные имена. Затем каждый сказал соседу слева: «Самый младший из нас – …», назвав имя сотрудника. Сколько различных имён они могли назвать теперь?"
    image_art: "13.png"
    image_scheme: ""
    number: 13
  - author: "Гусейн Гусейнов и Фарид Мирзалиев"
    problem: "Один квадрат расположен внутри другого. Проведены две взаимно перпендикулярные прямые, причём каждая прямая пересекает у каждого квадрата две противоположные стороны (см. рисунок). Докажите, что сумма красных отрезков равна сумме синих отрезков."
    image_art: "14.png"
    image_scheme: "14-scheme.png"
    number: 14
  - author: "Сергей Костин"
    problem: "Можно ли поставить одну ладью на белое поле шахматной доски 8&thinsp;×&thinsp;8 и ещё семь ладей на чёрные поля так, чтобы никакие две ладьи не оказались на одной горизонтали или на одной вертикали?"
    image_art: "15.png"
    image_scheme: ""
    number: 15
