tour:
  number: 9
  title: "IX тур"
  deadline: "5 июня"
  problems:
  - author: "Борис Френкин"
    problem: "Назовём <i>сложностью</i> натурального числа количество множителей в его разложении на простые числа. (Например, сложность числа 12 равна 3, так как 12 = 2•2•3.) Барон Мюнхгаузен утверждает, что умножил 10 раз подряд некоторое целое число на одну и ту же дробь, меньшую 1, и каждый раз получал натуральное число с большей сложностью. Могло ли такое быть?"
    image_art: "41.png"
    image_scheme: ""
    number: 41
  - author: "Татьяна Казицына"
    problem: "Разрежьте фигуру, изображённую на сетке из равносторонних треугольников, на две части, одинаковые по форме, но разные по размеру."
    image_art: "42.png"
    image_scheme: "42-scheme.png"
    number: 42
  - author: "Александр Грибалко"
    problem: "Ведущий загадал двузначное число и сообщил его первую цифру Пете, а вторую – Васе. Затем зрители задали три вопроса: является ли загаданное число точным квадратом, какая из цифр числа больше и различны ли цифры в числе. На первый вопрос Петя и Вася одновременно ответили «Нет», на второй – «Не знаю», а на третий – «Да». Какое число загадал ведущий?"
    image_art: "43.png"
    image_scheme: ""
    number: 43
  - author: "Михаил Мурашкин"
    problem: "На стороне AC треугольника ABC взяли точку D такую, что треугольники ABD и CBD имеют одинаковый периметр. Затем на отрезке DC взяли точку E такую, что треугольники DBE и CBE имеют одинаковый периметр. Докажите, что AD > DE."
    image_art: "44.png"
    image_scheme: ""
    number: 44
  - author: "Игорь Акулич"
    problem: "В какое наибольшее число цветов можно раскрасить клетки шахматной доски, чтобы у каждой клетки больше половины соседей были того же цвета, что и она сама? (Приведите пример раскраски и докажите, что в большее число цветов раскрасить не получится. Соседями считаются клетки, имеющие общую сторону.)"
    image_art: "45.png"
    image_scheme: ""
    number: 45
