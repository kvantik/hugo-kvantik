tour:
  deadline: 5 октября
  number: 1
  problems:
  - author: 'Георгий Караваев'
    image_art: 1.png
    image_scheme: '1-scheme.png'
    number: 1
    problem: 'Фигуру на рисунке разрежьте на 2 равные (по форме и по размеру) части.'
  - author: 'Сергей Полозков'
    image_art: 2.png
    image_scheme: '2-scheme.png'
    number: 2
    problem: 'Расставьте в квадратные клеточки на рисунке четыре различные цифры, а в каждый кружочек – различные знаки «+», «–», «•», «:» так, чтобы после выполнения четырёх действий (по стрелкам) получалось одно и то же число (на рисунке оно обозначено буквой x).'
  - author: 'Игорь Акулич'
    image_art: 3.png
    image_scheme: ''
    number: 3
    problem: 'Учитель написал на доске пять различных простых чисел. Третьеклассник Вася нашёл сумму трёх из них – получилось 100. Четвероклассник Петя нашёл сумму четырёх из них – получилось 1000. Какова сумма всех пяти чисел?'
  - author: 'Егор Бакаев, Борис Френкин'
    image_art: 4.png
    image_scheme: ''
    number: 4
    problem: 'Разрежьте закрытую картонную кубическую коробку на две части и сложите из каждой части новую закрытую прямоугольную коробку так, чтобы суммарный объём новых коробок был в два раза меньше объёма исходной коробки. (Резать и сгибать картон можно как угодно, лишь бы итоговые части не разваливались на куски; при складывании картон везде должен быть в один слой.)'
  - author: 'Сергей Костин'
    image_art: 5.png
    image_scheme: ''
    number: 5
    problem: 'На поле 77×77 каждая клетка синяя или зелёная, причём синих клеток 304. Если в каком-то квадрате 3×3 все клетки, кроме одной, синие, Квантику разрешается перекрасить единственную зелёную клетку тоже в синий цвет. <br>а) Придумайте такую начальную раскраску, чтобы Квантик, действуя по этому правилу, смог перекрасить всё поле в синий цвет. <br>б) Удалось бы придумать такую раскраску, если бы синих клеток было 303?'
  title: I тур
