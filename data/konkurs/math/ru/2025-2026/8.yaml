tour:
  number: 8
  deadline: "5 мая"
  title: "VIII тур"
  problems:
  - author: "Сергей Дориченко"
    problem: "Петя выписал несколько подряд идущих натуральных чисел, среди которых ровно 2 чётных. Вася выписал несколько подряд идущих натуральных чисел, среди которых ровно 9 чётных. Оказалось, что у Васи выписано в целое число раз больше чисел, чем у Пети. Во сколько?"
    image_art: "36.png"
    image_scheme: ""
    number: 36
  - author: "Михаил Евдокимов"
    problem: "Имеет ли ребус <br>МОЙ = К · В · А · Н · Т · И · К<br> решение? Разным буквам соответствуют разные цифры. Слева стоит трёхзначное число, состоящее из цифр М, О и Й."
    image_art: "37.png"
    image_scheme: ""
    number: 37
  - author: "Михаил Евдокимов"
    problem: "Клетчатый лист бумаги раскрасили в шахматном порядке. Существует ли такой треугольник с вершинами в узлах сетки, что площадь его белой части в два раза больше площади его чёрной части?"
    image_art: "38.png"
    image_scheme: ""
    number: 38
  - author: "Борис Френкин"
    problem: "Вдоль кольцевой трассы через равные расстояния высажены деревья: клёны, тополя, ясени и липы. Деревья каждого вида стоят через равные расстояния (для разных видов расстояния могут быть различны). Деревьев каждого из первых трёх видов ровно 4, а количество лип другое. Сколько всего деревьев высажено вдоль трассы? "
    image_art: "39.png"
    image_scheme: ""
    number: 39
  - author: "Константин Кноп"
    problem: "Из квадрата 7 × 7 с закрашенными клетками (см. рисунок) вырезали центральную клетку, после чего разрезали его на 8 равных (по форме и по размеру) многоугольников. Какое наибольшее число из них может не иметь закрашенных клеток? "
    image_art: "40.png"
    image_scheme: "40-scheme.png"
    number: 40
