tour:
  deadline: 5 декабря
  number: 3
  problems:
  - author: 'Михаил Евдокимов'
    image_art: 11.png
    image_scheme: ''
    number: 11
    problem: 'Имеются три карточки: с числом 1/4, числом 1/3 и числом –1/2. Если в автомат положить три карточки с числами, то через секунду он вернёт их и ещё одну, на которой напечатана сумма чисел на тех трёх карточках. Правда ли, что какое натуральное число ни назови, можно (использовав автомат несколько раз) напечатать карточку с этим числом?'
  - author: 'Борис Френкин'
    image_art: 12.png
    image_scheme: ''
    number: 12
    problem: 'Готовясь к олимпиаде, Петя и Вася в течение 10 дней решали задачи. В каждый следующий день Петя решал на 1 задачу больше, чем в прошедший, а Вася на 1 задачу меньше. В итоге Вася решил на 90 задач больше, чем Петя. Обязательно ли в какой-то день они решили поровну задач?'
  - author: 'Татьяна Казицына'
    image_art: 13.png
    image_scheme: ''
    number: 13
    problem: 'Все мыши весили одинаково, а кот весил столько же, сколько все мыши в сумме. Потом мыши съели сколько-то сыра, а после этого кот съел нескольких мышей. И теперь опять кот стал весить столько же, сколько оставшиеся мыши. Мышь может съесть сыра не больше, чем её вес. Докажите, что кот съел не более трети мышей.'
  - author: 'Сергей Шамсутдинов'
    image_art: 14.png
    image_scheme: ''
    number: 14
    problem: 'Разделите квадрат 3×3 на пять треугольников с различными площадями так, чтобы все вершины треугольников совпадали с вершинами единичных квадратов.'
  - author: 'Александр Грибалко'
    image_art: 15.png
    image_scheme: ''
    number: 15
    problem: 'Петя взял чётное число трёхклеточных уголков и сложил из них клетчатый прямоугольник (без дырок и наложений). Может ли быть так, что при любом его разрезании на доминошки найдётся уголок, разрезанный на три части?'
  title: III тур
