tour:
  number: 10
  title: "X тур"
  deadline: "5 июля"
  problems:
  - author: "Михаил Ильинский"
    problem: "а) В Африку завезли инновационные технологии, и теперь цена бурундийского франка каждые два месяца увеличивается в два раза, а цена руандийского франка каждые три месяца увеличивается в три раза. В какой валюте выгоднее хранить свои накопления в течение долгого срока (нескольких лет)? <br>б) Оказалось, что эритрейская накфа растёт в четыре раза каждые четыре месяца. Не выгоднее ли хранить накопления в эритрейских накфах?"
    image_art: "46.png"
    image_scheme: ""
    number: 46
  - author: "Борис Френкин"
    problem: "На острове живут правдолюбы, которые всегда говорят правду, и лжецы, которые всегда лгут. Все знают друг про друга, кто есть кто. Всем островитянам задали вопрос: «Среди вас больше правдолюбов, больше лжецов или их поровну»? По крайней мере половина ответила, что лжецов больше. Что ответили остальные?"
    image_art: "47.png"
    image_scheme: ""
    number: 47
  - author: "Татьяна Казицына"
    problem: "Петя и Вася стартовали одновременно из одной точки и побежали по кольцевой дорожке в одну сторону с постоянными скоростями. Через 5 минут расстояние между ними (кратчайшее вдоль дорожки) было равно 50 м. Ещё через 5 минут расстояние между ними опять было 50 м. Чему равна длина дорожки?"
    image_art: "48.png"
    image_scheme: ""
    number: 48
  - author: "Иван Русских"
    problem: "Алёша, Боря, Ваня, Гоша и Дима встали в разные места лужайки так, что никакие трое не попали на одну прямую. Затем каждый повернулся вокруг себя по часовой стрелке, записывая первые буквы имён тех, кто оказывался напротив него. У Алёши получилось БВГД, у Бори – ВАДГ, у Вани – ГДБА. Приведите пример того, как могли стоять мальчики."
    image_art: "49.png"
    image_scheme: ""
    number: 49
  - author: "Михаил Евдокимов"
    problem: "Шахматный король прошёл из левой нижней клетки шахматной доски 8×8 в правую верхнюю, побывав на каждой клетке доски ровно один раз. Могло ли оказаться, что количество диагональных ходов короля вдвое больше количества горизонтальных и вдвое меньше количества вертикальных ходов?"
    image_art: "50.png"
    image_scheme: ""
    number: 50
