tour:
  number: 12
  title: "XII тур"
  deadline: "5 сентября"
  problems:
  - author: "Георгий Караваев"
    problem: "Разрежьте фигуру на рисунке на 3 равные (по форме и по размеру) части."
    image_art: "56.png"
    image_scheme: "56-scheme.png"
    number: 56
  - author: "Михаил Евдокимов"
    problem: "Школьник Витя недавно сложил из спичек год своего рождения и год рождения своего папы. На год рождения папы ушло на 7 спичек больше. На сколько лет папа старше Вити? (Цифры выкладываются из спичек по образцу на рисунке.)"
    image_art: "57.png"
    image_scheme: "57-scheme.png"
    number: 57
  - author: "Татьяна Казицына"
    problem: "Аня идёт на день рождения по дороге, проходящей через мост. Миновав мост, Аня спустя какое-то время обнаружила, что забыла дома подарок. Она позвонила домой младшему брату Боре, и он побежал с подарком к Ане. У Бори хватит сил добежать до моста, а дальше он пойдёт пешком. Бегает Боря быстрее, чем движется Аня, а идёт медленнее. Аня планирует какое-то время идти назад навстречу Боре, а потом, возможно, подождать его. Как действовать Ане, чтобы прийти на день рождения с подарком как можно раньше?"
    image_art: "58.png"
    image_scheme: ""
    number: 58
  - author: "Борис Френкин"
    problem: "Каждое ребро куба покрашено в красный, зелёный или синий цвет. В каждой вершине сходятся три ребра разных цветов. Могут ли какие-то три ребра трёх различных направлений быть одного цвета?"
    image_art: "59.png"
    image_scheme: ""
    number: 59
  - author: "Дмитрий Калинин"
    problem: "По кругу написано 111 натуральных чисел, каждое число красное или синее. Может ли оказаться, что соседи одинакового цвета всегда отличаются на 1, а соседи разных цветов – на 2?"
    image_art: "60.png"
    image_scheme: ""
    number: 60
