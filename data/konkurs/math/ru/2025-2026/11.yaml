tour:
  number: 11
  title: "XI тур"
  deadline: "5 августа"
  problems:
  - author: "Сергей Дворянинов и Сергей Федин"
    problem: "Можно ли в выражении <br>КОТ + ПЁС = ШУМ<br> заменить разные буквы разными цифрами от 1 до 9 так, чтобы получилось верное равенство, в котором при сложении не было бы переходов через разряд?"
    image_art: "51.png"
    image_scheme: ""
    number: 51
  - author: "Иван Русских"
    problem: "а) У Вани каждый месяц за пользование телефоном списывается ровно 600 р. Кроме того, у Вани подключён автоплатёж: если на счёте меньше 500 р., он тут же пополняется на 400 р. (если денег всё ещё меньше 500 р. – автоплатёж совершается ещё раз). Если же на счёте окажется не меньше 500, но меньше 600 р., Ване придётся пополнить счёт вручную. Может ли Ваня изначально положить на счёт столько денег, чтобы ему больше никогда не пришлось пополнять счёт вручную? <br>б) Тот же вопрос, если счёт автоматически пополняется не на 400, а на 500 р. (остальные условия прежние)."
    image_art: "52.png"
    image_scheme: ""
    number: 52
  - author: "Михаил Евдокимов"
    problem: "Разрежьте какой-нибудь шестиугольник, стороны которого имеют длины 1, 2, 3, 4, 5, 6 (в каком-то порядке), на три равносторонних треугольника. (Шестиугольник может быть невыпуклым; треугольники могут быть разными по размеру.)"
    image_art: "53.png"
    image_scheme: ""
    number: 53
  - author: "Борис Френкин"
    problem: "Несколько ребят (больше двух) сыграли в пинг-понг навылет: установили очередь к столу, победитель очередной пары играл со следующим по очереди. Потом ребята установили очередь заново и опять сыграли навылет. Оказалось, что все игравшие пары были те же, что в первый раз, но в каждой паре победитель был другой. Во второй очереди Вася был последним. Выиграл он эту партию или проиграл?"
    image_art: "54.png"
    image_scheme: ""
    number: 54
  - author: "Сергей Полозков"
    problem: "У Квантика есть 25 квадратных плиток, каждая разделена диагональю на белую и синюю половины. Он хочет выложить квадратную мозаику 5 × 5, в которой плитки примыкают друг к другу одинаково окрашенными сторонами (см. пример на рисунке). <br>Сколькими способами Квантик может выложить мозаику? Способы, получающиеся друг из друга поворотами и отражениями, считаются разными."
    image_art: "55.png"
    image_scheme: "55-scheme.png"
    number: 55
