tour:
  deadline: 5 января
  number: 4
  problems:
  - author: 'Татьяна Казицина'
    image_art: 16.png
    image_scheme: ''
    number: 16
    problem: 'Пётр, Павел и Панкрат всегда отвечают правду. Фома, Фрол и Филимон всегда отвечают неправду. Например, на вопрос «Твоё имя — Пётр?» четверо ответят «да» и двое ответят «нет». Придумайте простой вопрос, на который один ответит «да» и пятеро ответят «нет».'
  - author: 'Георгий Караваев'
    image_art: 17.png
    image_scheme: '17-scheme.png'
    number: 17
    problem: 'Разрежьте приведённую на рисунке фигуру на 2 равные (по форме и по размеру) части.'
  - author: 'Михаил Евдокимов'
    image_art: 18.png
    image_scheme: ''
    number: 18
    problem: 'На листе бумаги втайне от вас написали последовательность из 10 натуральных чисел, в которой каждое следующее число, начиная с третьего, равно сумме двух предыдущих. За один вопрос можно узнать сумму любых пяти различных чисел на листе. За какое наименьшее число вопросов можно узнать хотя бы одно записанное число?'
  - author: 'Александр Перепечко'
    image_art: 19.png
    image_scheme: ''
    number: 19
    problem: 'Барон Мюнхгаузен рассказывал, что однажды подошёл к озеру, на котором росли три лилии. Он бросил три камушка, которые одновременно упали в воду и от каждого по воде пошла одна круговая волна. Барон утверждает, что 1-я лилия колыхнулась по очереди волнами от 1-го, 2-го и 3-го камушков, 2-я лилия — волнами от 2-го, 3-го и 1-го камушков, а 3-я лилия — волнами от 3-го, 1-го и 2-го камушков (именно в таком порядке). Мог ли барон быть прав? (Волны расходятся с одной и той же постоянной скоростью.)'
  - author: 'Георгий Караваев'
    image_art: 20.png
    image_scheme: ''
    number: 20
    problem: 'Бегун отправился на ежедневную пробежку. Сначала он бежал по тропинке с постоянной скоростью, а потом по асфальтированной дорожке, уже с другой постоянной скоростью. На первую половину пути бегун потратил две трети времени пробежки, а на последние две трети пути он потратил половину времени пробежки. Какую часть дистанции составляет тропинка?'
  title: IV тур
