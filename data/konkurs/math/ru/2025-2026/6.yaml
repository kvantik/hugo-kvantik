tour:
  deadline: 5 марта
  number: 6
  problems:
  - author: 'Сергей Полозков'
    image_art: 26.png
    image_scheme: '26-scheme.png'
    number: 26
    problem: 'Алиса и Боб поделили между собой все детальки на рисунке, а затем каждый сложил из своих деталек плоскую фигуру (без наложений, поворачивая детали при необходимости). Могли ли у них получиться одинаковые фигуры?'
  - author: 'Борис Френкин'
    image_art: 27.png
    image_scheme: ''
    number: 27
    problem: 'На двух чашах весов лежит по три монеты, перевешивает левая чаша. Известно, что если выбрать любые две монеты на разных чашах и поменять эти монеты местами, всё равно перевесит левая чаша. Квантик вместо этого поменял местами две монеты левой чаши с двумя монетами правой. Можно ли точно сказать, какая чаша перевесит теперь?'
  - author: 'Георгий Караваев'
    image_art: 28.png
    image_scheme: ''
    number: 28
    problem: 'У Коли есть три двусторонние карточки, на которых в некотором по-
    рядке написаны цифры 1, 2, 3, 4, 5 и 7 (на каждой стороне одна цифра). Он
    сложил из них всевозможные трёхзначные числа и выписал их в список по
    возрастанию. Семнадцатым в этом списке оказалось число 325. Какое число оказалось в списке пятнадцатым'
  - author: 'Григорий Мерзон'
    image_art: 29.png
    image_scheme: '29-scheme.png'
    number: 29
    problem: 'Оказывается, из 18 копий некоторого пятиугольника можно, не переворачивая их, а только поворачивая, сложить правильный 18-угольник (см. рисунок). Найдите углы этого пятиугольника.'
  - author: 'Георгий Караваев'
    image_art: 30.png
    image_scheme: ''
    number: 30
    problem: 'За круглым столом сидит 101 человек, каждый из которых является либо рыцарем (всегда говорит правду), либо лжецом (всегда лжёт). Скажем, что справа от человека сидит 50 ближайших его соседей справа, а остальные сидят слева от него. Каждый из сидящих за столом сказал: «Справа от меня сидит больше лжецов, чем слева». Сколько рыцарей могло быть за столом? Найдите все варианты и докажите, что других нет.'
  title: VI тур
