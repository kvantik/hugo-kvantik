tour:
  deadline: 5 февраля
  number: 5
  problems:
  - author: 'Дмитрий Калинин'
    image_art: 21.png
    image_scheme: '21-scheme.png'
    number: 21
    problem: 'Разрежьте фигуру на рисунке на 4 равные части.'
  - author: 'Сергей Дворянинов'
    image_art: 22.png
    image_scheme: ''
    number: 22
    problem: 'Незнайка написал по порядку все натуральные числа от 1 до 2026. Сначала он писал их одним цветом, потом другим и, наконец, третьим. Могло ли наименьшее синее число оказаться равным количеству красных чисел, а наибольшее зелёное – количеству синих чисел?'
  - author: 'Игорь Акулич'
    image_art: 23.png
    image_scheme: ''
    number: 23
    problem: 'Барон Мюнхгаузен заявил: «Можно нарисовать четырёхугольник, у которого две противоположные стороны перпендикулярны, две другие противоположные стороны тоже перпендикулярны, да ещё и диагонали перпендикулярны!» Не ошибается ли барон?'
  - author: 'Татьяна Казицына'
    image_art: 24.png
    image_scheme: ''
    number: 24
    problem: 'В наборе есть 10 карточек – с числом 1, с числом 2, …, с числом 10. У Васи есть 4 таких набора. Если Вася выложит все 40 карточек в круг, папа даст Васе по одной конфете за каждую пару соседних карточек, разность чисел на которых равна 1 (из большего вычитается меньшее). Какое наибольшее количество конфет может получить Вася? (Приведите пример и докажите, что большее количество конфет Вася получить не сможет.)'
  - author: 'Ольга Манжина'
    image_art: 25.png
    image_scheme: ''
    number: 25
    problem: 'Есть чашечные весы без гирь и 8 монет; одна из них фальшивая (легче остальных), одна – волшебная (когда она лежит на чаше весов, весы находятся в равновесии). Найдите и фальшивую, и волшебную монеты, потратив всего не более 5 взвешиваний.'
  title: V тур
