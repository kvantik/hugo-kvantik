tour:
  deadline: 5 ноября
  number: 2
  problems:
  - author: 'Алексей Толпыго'
    image_art: 6.png
    image_scheme: ''
    number: 6
    problem: 'Шахматный конь стоит на поле a1 шахматной доски. За какое наименьшее число ходов он может обойти все остальные поля диагонали a1–h8?'
  - author: 'Михаил Евдокимов'
    image_art: 7.png
    image_scheme: ''
    number: 7
    problem: 'Барон Мюнхгаузен вырезал из бумаги две одинаковые фигуры. Он утверждает, что можно положить их на стол без перекрытий тремя разными способами так, что объединённая фигура в первом случае будет иметь ровно одну ось симметрии, во втором – ровно две, а в третьем – ровно три. Могут ли слова барона оказаться правдой?'
  - author: 'Сергей Костин'
    image_art: 8.png
    image_scheme: ''
    number: 8
    problem: 'В классе 25 учеников. Могут ли они построиться в виде квадрата 5×5 так, чтобы рядом с каждой девочкой (то есть слева, справа, спереди или сзади от неё) стояло ровно два мальчика, если в классе: <br>а) 12 девочек и 13 мальчиков;<br>б) 13 девочек и 12 мальчиков?'
  - author: 'Сергей Костин'
    image_art: 9.png
    image_scheme: '9-scheme.png'
    number: 9
    problem: 'На доске написаны числа (см. рисунок).
    Квантик рассмотрел всевозможные наборы из трёх различных чисел, написанных на доске. В каждом наборе он перемножил все числа и все эти произведения сложил, получилось число A. Ноутик рассмотрел всевозможные наборы из семи различных чисел, написанных на доске. В каждом наборе он перемножил все числа и все эти произведения сложил, получилось число B. Какое число больше – A или B?'
  - author: 'ученики 10 класса Гусейн Гусейнов и Фарид Мирзелиев'
    image_art: 10.png
    image_scheme: '10-scheme.png'
    number: 10
    problem: 'Все стороны шестиугольника касаются круга (см. рисунок). Центр круга соединили отрезками с вершинами шестиугольника, разбив круг на 6 секторов. Эти секторы поочерёдно закрасили в красный и синий цвета. Докажите, что суммарная площадь красных секторов равна суммарной площади синих.'
  title: II тур
