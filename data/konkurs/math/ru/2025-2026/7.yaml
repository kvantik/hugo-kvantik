tour:
  deadline: 5 апреля
  number: 7
  problems:
  - author: 'Борис Френкин'
    image_art: 31.png
    image_scheme: ''
    number: 31
    problem: 'Каждый из троих жителей острова либо правдолюб (всегда говорит правду), либо лжец (всегда лжёт), причём они знают друг о друге, кто из них кто. Когда они сидели вокруг костра, пришёл путешественник и спросил каждого: «Твой сосед справа — правдолюб?» Прозвучали три ответа (в каком-то порядке): «Да», «Нет», «Не знаю». Правдолюб или лжец тот, о ком сказано «Не знаю»?'
  - author: 'Владимир Красноухов'
    image_art: 32.png
    image_scheme: '32-scheme.png'
    number: 32
    problem: 'Пришла пора разобрать ёлку до следующей зимы! Разделите фигуру на рисунке на 
6 равных (одинаковых по форме и размерам) частей и сложите из этих частей три зеркально-симметричные ёлочки.'
  - author: 'Михаил Ильинский'
    image_art: 33.png
    image_scheme: ''
    number: 33
    problem: 'Барон Мюнхгаузен утверждает, что какие две различные правильные 
дроби с одинаковым знаменателем ни  возьми, между ними найдётся правильная дробь (необязательно несократимая) как со знаменателем на 1 меньше, так и со знаменателем на 1 больше. Не ошибается ли барон? (Числители и знаменатели всех дробей положительны.)'
  - author: 'Николай Долбилин'
    image_art: 34.png
    image_scheme: '34-scheme.png'
    number: 34
    problem: 'Квантик выложил на столе 25 тяжёлых одинаковых круглых 
монет радиуса 5 мм в виде замкнутой цепочки (каждая монета касается двух соседних). Затем он надел на монеты тонкую резинку, идущую по периметру цепочки, и оказалось, что резинка натянута и касается 
каждой монеты (см. пример на рисунке). На сколько миллиметров растянется резинка, если в цепочку 
добавить 26-ю монету (так, чтобы по-прежнему каждая монета касалась двух соседних и резинки)?'
  - author: 'Кирилл Белоусов'
    image_art: 35.png
    image_scheme: ''
    number: 35
    problem: 'Профессор Чайников изобрёл трёхчашечные весы. За одно взвешивание можно положить в чаши по грузу (или ничего не класть), и чаша с самым лёгким грузом поднимется вверх, а две другие чаши одинаково опустятся вниз. (Если самых лёгких грузов несколько, поднимется только один из них (какой угодно), а оставшиеся одинаково опустятся.)<br> 
Профессору принесли 179 монет, из них 178 настоящие и весят одинаково, а одна – фальшивая, отличающаяся по весу. Как ему за несколько взвешиваний определить фальшивую монету, если она <br>а) легче настоящей;
<br>б) тяжелее настоящей?
<br>в) Сможет ли профессор определить фальшивую 
монету за конечное количество взвешиваний, если 
неизвестно, легче она или тяжелее настоящей?'
  title: VII тур
