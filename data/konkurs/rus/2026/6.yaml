tour:
  number: 6
  title: "VI тур"
  deadline: "20 декабря"
  problems:
  - author: "С. А. Гамаюнова"
    problem: "Условная запись, отражающая количество разных букв и порядок их расположения в слове <i>бобр</i>, образует перевёрнутую последовательность чисел Фибоначчи. Найдите семибуквенное слово (нарицательное, в словарной форме), обладающее тем же свойством."
    image_art: "26.png"
    image_scheme: "26-scheme.png"
    number: 26
  - author: "И. Б. Иткин"
    problem: "– Папа, о чём вам читал лекции профессор Умнов, когда ты учился в университете?<br>– Профессор Умнов читал нам лекции ЗАСЛУЖЕННО.<br>– Папа! Я понимаю, что он читал вам лекции ЗАСЛУЖЕННО! Я спрашиваю, о чём он читал вам лекции.<br>– Я же тебе сказал: профессор Умнов читал нам лекции ЗАСЛУЖЕННО!!!<br>Что мы заменили словом ЗАСЛУЖЕННО?"
    image_art: "27.png"
    image_scheme: ""
    number: 27
  - author: "А. А. Мокеев"
    problem: "Если отпустить АЛЬФУ, она появится. Найдите АЛЬФУ."
    image_art: "28.png"
    image_scheme: ""
    number: 28
  - author: "А. С. Нужненко"
    problem: "Название этого архипелага состоит из двадцать первой и седьмой. Что это за архипелаг?"
    image_art: "29.png"
    image_scheme: ""
    number: 29
  - author: "А. Е. Чернобровкина"
    problem: "– Обратите внимание, дорогой Ватсон: когда речь идёт, скажем, о ящиках с моей картотекой, глагол 1 и глагол 2, как им и положено, имеют противоположные значения, – сказал Шерлок Холмс. – А вот когда речь идёт о подозреваемых, глагол 1 и глагол 2 если и не обозначают в точности одно и то же, то, по крайней мере, одинаково затрудняют расследование.<br>Напишите возвратные глагол 1 и глагол 2, отличающиеся только приставками."
    image_art: "30.png"
    image_scheme: ""
    number: 30
