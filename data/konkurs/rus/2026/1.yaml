tour:
  deadline: 20 февраля
  number: 1
  problems:
  - author: 'О. Д. Гаврилко'
    image_art: 1.png
    image_scheme: ''
    number: 1
    problem: 'Между этими двумя математическими терминами — три ноты: <i>фа, соль</i> и <i>ля</i>. Напишите эти термины.'
  - author: 'И. Б Иткин'
    image_art: 2.png
    image_scheme: ''
    number: 2
    problem: 'Своё короткое название эта птица получила за издаваемый ею очень громкий крик. Что это за птица?'
  - author: 'С. И. Переверзева'
    image_art: 3.png
    image_scheme: ''
    number: 3
    problem: 'Какая обувь, по мнению маленького Лёвы, усыпляет?'
  - author: 'С. С. Полозков'
    image_art: 4.png
    image_scheme: ''
    number: 4
    problem: '«Пять первых премий и одна поощрительная, — размышляет Квантик. — Значит, для упаковки призов мне понадобятся 5 больших ______ и 1 ______».<br>Заполните любой из пропусков так, чтобы мы не смогли определить, какой из двух пропусков вы заполнили.'
  - author: 'А. А. Широкова'
    image_art: 5.png
    image_scheme: ''
    number: 5
    problem: '— Ушки мои, усики! Я всё время куда-то БЕГУ, всё время СУЕЧУСЬ! — жаловался Алисе Белый Кролик.<br>Какие слова мы заменили на БЕГУ и СУЕЧУСЬ, если второе из них получается из первого добавлением одной буквы?'
  title: I тур
