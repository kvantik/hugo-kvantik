tour:
  number: 5
  title: "V тур"
  deadline: "20 октября"
  problems:
  - author: "В. Н. Авраменко"
    problem: "АЛЬФА, БЕТА и ГАММА тесно связаны между собой. Они часто используются вместе в математических задачах и различных играх. Слова АЛЬФА, БЕТА и ГАММА начинаются на три идущие подряд буквы в начале алфавита. Что это за слова?"
    image_art: "21.png"
    image_scheme: ""
    number: 21
  - author: "Г. Д. Ермолаев"
    problem: "Когда слышишь ЧЕТВЁРТУЮ-ПЯТУЮ – услада для ушей, когда кушаешь ЧЕТВЁРТУЮПЯТУЮ – услада для желудка. Назовите ЧЕТВЁРТУЮПЯТУЮ."
    image_art: "22.png"
    image_scheme: ""
    number: 22
  - author: "Е. В. Жемчужная, Н. А. Рылова"
    problem: "Однажды Лиза увидела рекламный плакат примерно такого содержания:<br>«Почти половина населения Земли жалуется на одиночество, на наш шашлык – ___ ___!»<br>К сожалению, автор плаката допустил распространённую орфографическую ошибку, из-за которой реклама превратилась в антирекламу. Напишите два пропущенных слова так, как они были написаны на плакате."
    image_art: "23.png"
    image_scheme: ""
    number: 23
  - author: "Э. С. Кондрашова"
    problem: "– Я сегодня попробовал ____. С ума сойти, до чего вкусно! – рассказывал родным дошкольник Вася.<br>– Разве ____ едят? Туда пишут! – удивился Васин старший брат Петя.<br>Название какого фрукта слегка переделал на русский лад Вася и что у него получилось?"
    image_art: "24.png"
    image_scheme: ""
    number: 24
  - author: "М. Р. Ханмагомедова"
    problem: "Катя купила машину и позвала свою подругу Лену на неё полюбоваться.<br>– Блеск! – сказала Лена. – А уж номер... Ну да, ты же по жизни оптимистка, вот и в качестве номера взяла себе слово ОПТИМИСТИЧЕСКИ.<br>– Честное слово, я не нарочно!.. – только и смогла сказать Катя, с трудом удерживаясь от смеха.<br>Какое наречие мы заменили на ОПТИМИСТИЧЕСКИ?<br>(Автомобильный номер – это последовательность из одной буквы, трёх цифр и двух букв: например, Х444МР. Все буквы должны совпадать по начертанию с какими-нибудь буквами латинского алфавита.)"
    image_art: "25.png"
    image_scheme: ""
    number: 25
