tour:
  number: 4
  title: "IV тур"
  deadline: "20 августа"
  problems:
  - author: "С. А. Гамаюнова"
    problem: "Название этого продукта можно принять за сложное слово, первая часть которого означает сильное потрясение, а вторая, на­ оборот, мир и отсутствие потрясений. Что это за продукт?"
    image_art: "16.png"
    image_scheme: ""
    number: 16
  - author: "И. Б. Иткин"
    problem: "Как известно, в привычном нам календаре июнь идёт прямо перед июлем. А вот ТАМ июнь чаще всего идёт через один после июля. Где ТАМ и почему через один?"
    image_art: "17.png"
    image_scheme: ""
    number: 17
  - author: "В. Л. Карлинский"
    problem: "Очень страшная история. Один человек пошёл в лес за грибами. Принёс добычу домой, сложил в холодильник. Утром открыл холодильник – все грибы на месте, зато ЕГО нет. Назовите ЕГО и скажите, куда ОН исчез."
    image_art: "18.png"
    image_scheme: ""
    number: 18
  - author: "С. И. Переверзева"
    problem: "На вопрос мамы, указал ли он постоянные признаки в морфологическом разборе глагола, четвероклассник Лёва ответил фразой, которую в прямом смысле можно понять как «частично да», а в переносном – как «нет». Что сказал Лёва?"
    image_art: "19.png"
    image_scheme: ""
    number: 19
  - author: "М. Р. Ханмагомедова"
    problem: "107 – 5 = ИЙ<br>70 – 65 = ИТ<br>91 – 89 = ?"
    image_art: "20.png"
    image_scheme: ""
    number: 20
