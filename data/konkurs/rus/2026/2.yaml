  - author: 'И. Б. Иткин'
    image_art: 6.png
    image_scheme: ''
    number: 6
    problem: 'Профессор Мышкин предлагает писать эти слова так:<br><i>...бр..., ...брр..., ...бррр..., ...брррр...</i>.<br> Запишите эти слова обычным способом.'
  - author: 'В. А. Караваева'
    image_art: 7.png
    image_scheme: ''
    number: 7
    problem: 'Маленькая Лиза учится читать и писать. Она уже хорошо знает, как произносится название цифры 4, но пишет его, пропуская одну букву. Как Лиза пишет это название и как объясняет, почему именно её вариант «правильный»?'
  - author: 'А. С. Нужненко'
    image_art: 8.png
    image_scheme: ''
    number: 8
    problem: 'Встреча после каникул:<br>М&thinsp;а&thinsp;ш&thinsp;е&thinsp;н&thinsp;ь&thinsp;к&thinsp;а. Я летом была в Европе, всё вокруг такое необычное, красивое, особенно мне понравилась одна старинная САХАРА.<br>В&thinsp;о&thinsp;в&thinsp;о&thinsp;ч&thinsp;к&thinsp;а. Подумаешь, Европа... Этот САХАР у моей бабушки в деревне растёт, смотри не хочу, и ездить никуда не надо!<br> Какие слова мы заменили на САХАРА и САХАР?'
  - author: 'С. С. Полозков'
    image_art: 9.png
    image_scheme: ''
    number: 9
    problem: 'Петя тайком от родителей запускал в парке воздушного змея. Вася наблюдал. Змей 
застрял на высоком дереве, нитка порвалась. Змей так и ___________ на дереве целую неделю, а Вася ___________ уже на следующее утро. Какое слово мы пропустили?'
  - author: 'М. Р. Ханмагомедова'
    image_art: 10.png
    image_scheme: ''
    number: 10
    problem: 'Это слово может быть существительным, а может – глаголом, который означает «движутся напролом». Напишите это слово.'
