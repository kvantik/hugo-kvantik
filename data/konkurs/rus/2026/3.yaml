tour:
  number: 3
  title: "III тур"
  deadline: "20 июня"
  problems:
  - author: "В. Н. Авраменко"
    problem: "«______ – это когда не осталось никакой _____. Значит, тут пишется непроизносимая согласная Д», – вроде бы логично рассудил Вовочка и написал слово с ошибкой. Заполните пропуски."
    image_art: "11.png"
    image_scheme: ""
    number: 11
  - author: "И. Б. Гуревич"
    problem: "Маленькая Ира в шутку предположила, что это животное такое грациозное, потому что вообще не ест. Назовите это животное."
    image_art: "12.png"
    image_scheme: ""
    number: 12
  - author: "С. В. Дьяченко"
    problem: "В Воронежской области есть сёла, где говорят по-русски, и сёла, где говорят по-украински. Девушка Валя из русского села Кучугуры вышла замуж в украинское село Вознесенку. Однажды ей показалось, что свекровь попросила её принести <i>шведку</i>. Сначала Валя удивилась, но потом вспомнила, что свекровь говорила ей обязательно ставить на стол <i>свель</i> и упоминала про большой <i>ствег</i> сена; тогда она догадалась, о чём её просят. Что принесла Валя свекрови?"
    image_art: "13.png"
    image_scheme: ""
    number: 13
  - author: "О. Ю. Савина"
    problem: "Старшеклассник Валера готовил уроки. Рядом мама читала сказку маленькой Олечке: <br>– ...и сделали они себе дочку, всю из снега, и назвали Снегурочкой... <br>– А сделали бы они её abc defg, звалась бы она Abcdefg, – не удержался Валера. <br>Напишите слова abc, defg и Abcdefg."
    image_art: "15.png"
    image_scheme: ""
    number: 15
  - author: "И. Б. Иткин"
    problem: "В стихах Пушкина не встречается слово <i>пират</i>. Вместо него Пушкин использует выражение из двух слов. Какое?"
    image_art: "14.png"
    image_scheme: ""
    number: 14
