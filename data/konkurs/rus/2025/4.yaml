tour:
  deadline: 20 августа
  number: 4
  problems:
  - author: 'Т. А. Амбарцумова'
    image_art: 16.png
    image_scheme: ''
    number: 16
    problem: 'Дедушка Владимир Михай­лович занимается разведением пчёл. Многие его знакомые, которые не слишком хорошо разбираются в пчеловодстве, зовут Влади­мира Михайловича не пасечником, а попросту _________. «Съесть они меня хотят, что ли?» — смеётся дедушка. Заполните пропуск.'
  - author: 'И. Б. Иткин'
    image_art: 17.png
    image_scheme: ''
    number: 17
    problem: '<i>Вчера Вася прогулял полчаса.<br>Вчера Вася прогулял час.<br>Вчера Вася прогулял полтора часа.<br>Вчера Вася прогулял два часа.<br>Вчера Вася прогулял полдня.</i><br>Какое прилагательное надо добавить в одно из этих сообщений, чтобы поступок ученика шестого «А» Васи Кошкина стал безусловно заслуживающим порицания?'
  - author: 'С. И. Переверзева'
    image_art: 18.png
    image_scheme: ''
    number: 18
    problem: '<i>(Из личной переписки.)</i><br><b>Вовочка:</b> Маша, я всё никак не решусь сказать тебе, что очень хочу то­бой увидеться, потому что...<br><b>Отличница Машенька:</b> _____________!<br><b>Вовочка</b> (в восторге)<b>:</b> Да, именно это я и имел в виду!<br>Восстановите сообщение Машеньки из двух слов.'
  - author: 'М. А. Ушаков'
    image_art: 19.png
    image_scheme: ''
    number: 19
    problem: 'Миша шёл из магазина, положив ЗУБЧИК в СУПЧИК. Какие слова мы заменили на ЗУБЧИК и СУПЧИК?'
  - author: 'М. Р. Ханмагомедова'
    image_art: 20.png
    image_scheme: ''
    number: 20
    problem: 'Одно из значений слова X — «круг, этап».<br>Одно из значений слова Y — «круг, этап».<br>Найдите 6-буквенный XY.'
  title: IV тур
