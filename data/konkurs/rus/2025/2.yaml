tour:
  deadline: 20 апреля
  number: 2
  problems:
  - author: 'В. Н. Авраменко'
    image_art: 6.png
    image_scheme: ''
    number: 6
    problem: 'По названию этого оружия можно догадаться, из дерева какой породы его первоначально изготав­ливали. Что это за оружие?'
  - author: 'И. Ф. Акулич'
    image_art: 7.png
    image_scheme: ''
    number: 7
    problem: 'Этот полезный предмет пример­но в 150 раз больше своего названия. Что это за предмет?'
  - author: 'И. Б. Иткин'
    image_art: 8.png
    image_scheme: ''
    number: 8
    problem: '<i>от</i> — 2; <i>к</i> — 3; <i>сквозь</i> — 4; <i>в</i> — 4, 6; <i>под</i> — ...?'
  - author: 'Л. З. Иткина'
    image_art: 9.png
    image_scheme: ''
    number: 9
    problem: '— Какие вкусные пироги печёт моя бабушка! — хвастался Вовочка одноклас­сникам, вернувшись из деревни. — А боль­шие какие! Прямо УХВАТНЫЕ! <br>— УХВАТНЫЙ пирог ни в одну печ­ку не влезет! — съехидничала отличница Машенька. — А бабушка твоя, наверное, печёт ОХВАТНЫЕ пироги. Они действи­тельно очень вкусные. <br>Какие прилагательные мы заменили на УХВАТНЫЕ и ОХВАТНЫЕ?'
  - author: 'С. И. Переверзева'
    image_art: 10.png
    image_scheme: ''
    number: 10
    problem: 'Обычно прилагательное с приставкой <i>без- (бес-)</i> означа­ет «совсем не X» — например, <i>бестолковый</i> = «совсем не толко­вый». Найдите прилагательное с приставкой <i>без- (бес-)</i>, которое означает «очень-очень X».'
  title: II тур
