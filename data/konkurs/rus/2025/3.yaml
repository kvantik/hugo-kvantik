tour:
  deadline: 20 июня
  number: 3
  problems:
  - author: 'Т. А. Амбарцумова'
    image_art: 11.png
    image_scheme: ''
    number: 11
    problem: 'Для занятия одной отраслью хозяйства, возникшей в глубокой древности, раньше часто исполь­зовалось пространство, специаль­но очищенное от леса. Назовите это пространство словом с редкой приставкой.'
  - author: 'И. Б. Иткин'
    image_art: 12.png
    image_scheme: ''
    number: 12
    problem: 'В некоторых языках этот географический термин начина­ется с части, означающей «поч­ти». А с какой части он начинает­ся в русском?'
  - author: 'Л. И. Иткин, С. И. Переверзева'
    image_art: 13.png
    image_scheme: ''
    number: 13
    problem: 'Лёва пишет рассказ:<br>«Автобус быстро вернулся, громы­хая дверями. Его (ёлки!) живо заполо­нили ________, которых любой может назвать обманщиками, порочащими родину слонов, танцовщиц, ушлых фа­киров...»<br>Заполните пропуск двумя словами.'
  - author: 'А. Л. Леонтьева, Д. А. Леонтьева'
    image_art: 14.png
    image_scheme: ''
    number: 14
    problem: 'АЛЬФУ удобно исполнять в БЕТАХ, а в ГАММАХ — не очень. АЛЬФА, БЕТА и ГАММА могут встретиться, например, на конкурсе «Мисс Вселенная». Назови­те АЛЬФУ, БЕТУ и ГАММУ в правильном порядке.'
  - author: 'С. С. Полозков'
    image_art: 15.png
    image_scheme: ''
    number: 15
    problem: 'Квантик организовал в шко­ле турнир по настольному тенни­су. В школьной стенгазете потом писали, что турнир был организо­ван хорошо и прошёл без НИХ.<br>На переменах школьники ино­гда играют в настольный теннис прямо ладонями — конечно, без НИХ.<br>Назовите ИХ.'
  title: III тур
