tour:
  deadline: 20 февраля
  number: 1
  problems:
  - author: 'В. Н. Авраменко, И. Б. Иткин'
    image_art: 1.png
    image_scheme: ''
    number: 1
    problem: '— Знаешь, Знайка, кто такие каскадёры? Это люди, которые со всех сдирают каски!<br>— Дурень ты, Незнайка! — отмахнулся Знайка. — Каскадёры — это люди, которые на съёмках фильмов всякие сложные трюки исполняют.<br>— Сам ты дурень, да ещё и зануда! — обиделся Незнайка. — Совсем шуток не понимаешь. <br>— Шутить тоже надо уметь! — стоял на своём Знайка. — Если бы слово «каскадёры» означало то, что ты говоришь, ... <br>Закончите мысль Знайки.'
  - author: 'С. А. Гамаюнова'
    image_art: 2.png
    image_scheme: ''
    number: 2
    problem: 'В существительном X чётное число букв. Буква, стоящая на первом месте, встречается в нём <i>n</i> раз, буква, стоящая на втором месте, <i>n–1</i> раз и так далее, пока буквы не начнут повторяться. Найдите X.'
  - author: 'Я. С. Елисеева, М. А. Ушаков, В. М. Ушакова'
    image_art: 28.png
    image_scheme: ''
    number: 28
    problem: 'Чтобы часы тебя не НАДУВАЛИ, их иногда бывает нужно НАДУВАТЬ. Какой глагол мы заменили на НАДУВАТЬ?'
  - author: 'С. И. Переверзева'
    image_art: 29.png
    image_scheme: ''
    number: 29
    problem: 'Если этот коротенький глагол в повелительном наклонении произнести задом наперёд, получится другой глагол в повелительном наклонении. Напишите оба глагола.'
  - author: 'А. Ч. Пиперски'
    image_art: 30.png
    image_scheme: ''
    number: 30
    problem: 'В одном научном сочинении для некоторого знака предлагается использовать название «плинус». Нарисуйте этот знак'
  title: I тур
