tour:
  deadline: 20 декабря
  number: 6
  problems:
  - author: 'И. Ф. Акулич'
    image_art: 26.png
    image_scheme: ''
    number: 26
    problem: 'С <i>кт</i> — сверху вниз. А с какими двумя буквами — снизу вверх?'
  - author: 'И. Б Иткин'
    image_art: 27.png
    image_scheme: ''
    number: 27
    problem: '&nbsp;&nbsp;на разные<br>&nbsp;&nbsp;на одну и ту же<br>&nbsp;&nbsp;на одну и ту же<br>&nbsp;&nbsp;на разные<br>&nbsp;&nbsp;на одну и ту же<br>&nbsp;&nbsp;на одну и ту же<br>&nbsp;&nbsp;на одну и ту же<br>&nbsp;&nbsp;на одну и ту же<br>&nbsp;&nbsp;на одну и ту же<br> Напишите те, которые на разные.'
  - author: 'О. А. Кузнецова'
    image_art: 28.png
    image_scheme: ''
    number: 28
    problem: 'Чего у раскидистой ёлки гораздо больше, чем у серого волка?'
  - author: 'К. В. Литвинцева'
    image_art: 29.png
    image_scheme: ''
    number: 29
    problem: '<i>Хать</i> бывает небезопасно, но риск — дело благородное, а вот <i>Хить</i> не надо никому и никогда. Какие глаголы мы заменили на <i>Хать</i> и <i>Хить</i>?'
  - author: 'С. И. Переверзева'
    image_art: 30.png
    image_scheme: ''
    number: 30
    problem: '— Итак, — объявил ведущий телевикто­рины «Желаем удачи» Ронни Обыграйт, — решающий вопрос: в названии этого механизма два раза подряд встречается один и тот же слог. Что это за механизм?<br>— Часы, мистер Обыграйт, — не задумываясь ответил медвежонок Паддингтон.<br>— Часы?! Мне очень жаль, но вы проиграли.<br>— Нет-нет, мистер Обыграйт, — возразил Паддингтон, — дело в том, что я имел в виду часы…<br>Через несколько секунд под хохот и апло­дисменты зрителей Ронни Обыграйт вручил Паддингтону главный приз.<br>Что мы пропустили в этой правдивой истории?<br><br>(По мотивам рассказа Майкла Бонда «Паддингтон-победитель».)'
  title: VI тур
