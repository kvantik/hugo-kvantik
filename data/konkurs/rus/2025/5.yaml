tour:
  deadline: 20 октября
  number: 5
  problems:
  - author: 'В. Н. Авраменко'
    image_art: 21.png
    image_scheme: ''
    number: 21
    problem: 'Отправляясь в путешествие по неизведанным местам, надо брать с собой целую АЛЬФУ разных вещей. Да-да, целую БЕТУ разных вещей. Ведь никогда не знаешь, что встретится тебе на пути – АЛЬФА или, наоборот, БЕТА. Назовите АЛЬФУ и БЕТУ.'
  - author: 'С. А. Гамаюнова'
    image_art: 22.png
    image_scheme: ''
    number: 22
    problem: 'Говорят, что любая ЭТАКАЯ собака мечтает стать чьей-нибудь ТАКОЙ собакой. Какие прилагательные мы заменили на ЭТАКАЯ и ТАКАЯ?'
  - author: 'Ф. И. Ченцов'
    image_art: 23.png
    image_scheme: ''
    number: 23
    problem: 'Вася на мартовские каникулы приехал из Краснодара в гости к своему другу Пете в Усолье-Сибирское. Едва они отошли на несколько шагов от вокзала, Вася воскликнул: «Ну и ну! Настоящий ________!»<br>– «Да, у нас красиво», – отозвался Петя. – «Красиво-то красиво, только не в такую погоду! Я же говорю: настоящий ________, да ещё и ветер ледяной». Какое редкое двухкорневое слово мы пропустили?'
  - author: 'А. Е. Чернобровкина'
    image_art: 24.png
    image_scheme: ''
    number: 24
    problem: 'Однажды на здании суда появилось примерно такое объявление: «Кто потерял в суде _____, обращаться к судебным приставам». Некий шутник под этим объявлением подписал: «Какие _____? Годы!» Заполните пропуск.'
  - author: 'А. А. Чугунова'
    image_art: 25.png
    image_scheme: ''
    number: 25
    problem: 'Если из рыбы прогнать насекомых, мы получим млекопитающее. Назовите эту рыбу, этих насекомых и это млекопитающее.'
  title: V тур
