{{$collection := (index .Site.Data.related_titles (.Get 0))}}


<div class="clearfix" style=" margin-bottom: 10px;">

{{range (index $collection "issues")}}

<div style="float:left; margin:20px; height:300px;">
    <a href="{{.ref}}">
   {{ $retina := replace .img ".jpg" "@2x.jpg" }}
   <img class="img-fluid" src="/{{.img}}"{{ if fileExists (printf "static/%s" $retina) }} srcset="/{{ $retina }} 2x"{{ end }} alt="{{.img}}">
    </a>
</div>

{{end}}

</div>
